name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on a fork: Actions must be enabled in the repo settings first, then this
  # makes the suite runnable on demand (and from `gh workflow run`) without a dummy commit.
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pyyaml==6.0.2
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Process benchmark — domain-agnostic invariants
        run: python bench/process_bench.py --gated
      - name: Process benchmark — negative tests (gates must catch real faults)
        run: python bench/process_bench.py --negative
      - name: Illustrative gold-set benchmark (runs, does not gate)
        # Not a gate: its gold sets encode one author's domain judgment, which is exactly
        # what the process benchmark deliberately avoids. Kept in CI so it cannot rot
        # silently — an unrun benchmark in a PR about benchmark honesty is a bad look.
        run: python bench/benchmark.py
      - name: Check the plugin manifest parses
        run: python -c "import yaml,sys; m=yaml.safe_load(open('plugin.yaml')); sys.exit(0 if m['name']=='bot-forge' and m['provides_tools'] else 1)"
      - name: Validate every bundled harness manifest
        # A community contribution is JSON. A typo there should fail a build, not surface
        # later as a Bot that quietly carries no skills.
        run: python bench/validate_manifest.py harnesses/
      - name: Shared-policy mutation check
        # The drift detector is only useful if it fails when drift exists. Each mutation
        # reverts one load-bearing decision in policy.py; every one must be caught.
        run: python bench/policy_mutation_check.py
      - name: External-skill mutation check
        # The process benchmark's oracle once called the same helpers it was checking, so
        # breaking external-dir discovery broke both sides and all 46 gates still passed.
        # This breaks the implementation and requires --gated to notice.
        run: python bench/external_mutation_check.py
      - name: Enumeration-order independence check
        # A skill can live in two category folders. Which copy "wins" depends on rglob order,
        # which differs between macOS and Linux — the benchmark passed locally and failed in
        # CI for exactly this reason. Force the other order and require the same verdict.
        run: python bench/order_mutation_check.py
