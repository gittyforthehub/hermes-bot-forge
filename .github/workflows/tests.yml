name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on a fork: Actions must be enabled in the repo settings first, then this
  # makes the suite runnable on demand (and from `gh workflow run`) without a dummy commit.
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pyyaml==6.0.2
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Process benchmark — domain-agnostic invariants
        run: python bench/process_bench.py --gated
      - name: Process benchmark — negative tests (gates must catch real faults)
        run: python bench/process_bench.py --negative
      - name: Check the plugin manifest parses
        run: python -c "import yaml,sys; m=yaml.safe_load(open('plugin.yaml')); sys.exit(0 if m['name']=='bot-forge' and m['provides_tools'] else 1)"
